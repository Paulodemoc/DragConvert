name: Release

# Push a tag like v0.1.0 (on main) to build, test and publish a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Version from tag
        id: version
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          "version=$v" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($v -match '-|^0\.') { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      - name: Fetch FFmpeg (LGPL)
        shell: pwsh
        run: ./tools/fetch-ffmpeg.ps1

      - name: Build and test
        run: |
          dotnet build DragConvert.slnx --configuration Release
          dotnet test DragConvert.slnx --configuration Release --no-build

      - name: Package
        shell: pwsh
        run: ./tools/package.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Smoke-run the packaged exe
        shell: pwsh
        run: ./tools/smoke.ps1 -Exe "artifacts/release/DragConvert-${{ steps.version.outputs.version }}-win-x64/DragConvert.exe"

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $flags = @('--generate-notes', '--title', "DragConvert $v")
          if ('${{ steps.version.outputs.prerelease }}' -eq 'true') { $flags += '--prerelease' }
          gh release create '${{ github.ref_name }}' @flags `
            "artifacts/release/DragConvert-$v-win-x64.zip" `
            "artifacts/release/DragConvert-$v-win-x64.zip.sha256"
