name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore: ['**.md', 'docs/**', 'assets/**']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Fetch FFmpeg (LGPL) for provider tests
        shell: pwsh
        run: ./tools/fetch-ffmpeg.ps1

      - name: Restore
        run: dotnet restore DragConvert.slnx

      - name: Build (warnings are errors)
        run: dotnet build DragConvert.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test DragConvert.slnx --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Smoke-run the app (starts, converts a tiny image, exits)
        shell: pwsh
        run: ./tools/smoke.ps1 -Exe "src/DragConvert.App/bin/Release/net10.0-windows10.0.19041.0/DragConvert.exe"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
